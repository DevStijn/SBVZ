name: sbvz

services:
  api:
    image: ${SBVZ_IMAGE:?Set SBVZ_IMAGE to an immutable image tag}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    env_file:
      - path: ${SBVZ_ENV_FILE:-/etc/sbvz/sbvz.env}
        required: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      SBVZ_ALLOWED_HOSTS: ${SBVZ_ALLOWED_HOSTS:?Set SBVZ_ALLOWED_HOSTS}
      SBVZ_TRUSTED_PROXIES: 172.30.33.2
      SBVZ_CLIENT_CERTIFICATE_PATH: /run/sbvz-secrets/client.pfx
      SBVZ_CLIENT_CERTIFICATE_PASSWORD_FILE: /run/sbvz-secrets/client-certificate-password
      SBVZ_API_KEY_SHA256_FILE: /run/sbvz-secrets/api-key-sha256
      SBVZ_AUDIT_S3_ACCESS_KEY_ID_FILE: /run/sbvz-secrets/audit-s3-access-key-id
      SBVZ_AUDIT_S3_SECRET_ACCESS_KEY_FILE: /run/sbvz-secrets/audit-s3-secret-access-key
      SBVZ_AUDIT_PATIENT_REFERENCE_KEY_FILE: /run/sbvz-secrets/audit-patient-reference-key
      SBVZ_AUDIT_PORTAL_PASSWORD_HASH_FILE: /run/sbvz-secrets/audit-portal-password-hash
      SBVZ_AUDIT_PORTAL_TOTP_SECRET_FILE: /run/sbvz-secrets/audit-portal-totp-secret
      SBVZ_ALERT_WEBHOOK_URL_FILE: /run/sbvz-secrets/alert-webhook-url
    volumes:
      - type: bind
        source: ${SBVZ_SECRET_DIRECTORY:-/etc/sbvz/secrets}
        target: /run/sbvz-secrets
        read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    expose:
      - "8080"
    networks:
      sbvz_private:
        ipv4_address: 172.30.33.3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine
    init: true
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      - api
    environment:
      SBVZ_PUBLIC_API_HOST: ${SBVZ_PUBLIC_API_HOST:?Set SBVZ_PUBLIC_API_HOST}
      SBVZ_PUBLIC_PORTAL_HOST: ${SBVZ_PUBLIC_PORTAL_HOST:?Set SBVZ_PUBLIC_PORTAL_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${SBVZ_INTERNAL_API_CA_CERTIFICATE:-/etc/sbvz/tls/internal-api-client-ca.pem}
        target: /run/sbvz-tls/internal-api-client-ca.pem
        read_only: true
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    networks:
      sbvz_private:
        ipv4_address: 172.30.33.2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  sbvz_private:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.33.0/29

volumes:
  caddy_data:
  caddy_config:
